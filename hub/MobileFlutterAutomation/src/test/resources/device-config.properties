############################################
# DEVICE CONFIGURATION
############################################

platformName=Android

# Device name (friendly name, not UDID)
deviceName=SM-515F/DSN

# Your real device UDID
#udid=emulator-5554
udid=RZ8NA06H1FJ

# Flutter automation
automationName=Flutter

############################################
# APP CONFIGURATION
############################################

appPackage=com.dbox.dbox_flutter.host
appActivity=com.dbox.dbox_flutter.host.MainActivity

# Debug/automation APK (MOBILE-9181) — local copy without spaces/parens for Appium
appPath=

############################################
# APPIUM SERVER
############################################

# Leave empty to start embedded Appium service
# For BrowserStack: set browserStack=true and provide credentials via system properties
appiumServerUrl=

############################################
# BROWSERSTACK CONFIG (used when browserStack=true)
############################################

browserStack=false

# BrowserStack Appium URL template — credentials injected at runtime
# bsUsername and bsAccessKey passed as -D system properties (never hardcode here)
bsAppiumUrl=https://<bsUsername>:<bsAccessKey>@hub-cloud.browserstack.com/wd/hub

# BrowserStack App URL — upload your APK to BrowserStack first
# Format: bs://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
bsAppUrl=

# BrowserStack device selection
bsDeviceName=Samsung Galaxy S51
bsPlatformVersion=1
bsProjectName=FlutterAppiumTest
bsBuildName=Regression-Build
bsSessionName=MobileLoginTest

############################################
# EXECUTION SETTINGS
############################################

noReset=true

newCommandTimeout=600

adbExecTimeout=120000

############################################
# PERFORMANCE / STABILITY
############################################

forceAppLaunch=true

waitForQuiescence=false

skipDeviceInitialization=false

disableWindowAnimation=true

autoGrantPermissions=true

ignoreHiddenApiPolicyError=true

printPageSourceOnFindFailure=true

eventTimings=true

unicodeKeyboard=false

resetKeyboard=false